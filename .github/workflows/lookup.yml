name: lookup-jan
on: {workflow_dispatch: {}}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python lookup_jan.py
        env:
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          LIMIT: "300"
      - run: |
          git config user.name bot && git config user.email bot@example.com
          git add jan_map.csv watchlist.csv review.csv
          git commit -m "lookup update" || exit 0
          git pull --rebase
          git push
